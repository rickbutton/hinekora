name: Site

# Builds the website (the home page, the docs and the playground inside it)
# and publishes it to GitHub Pages on every push to main. Pages must be set
# to deploy from GitHub Actions in the repository settings once.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# A deployment in flight finishes; the next push queues behind it.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The site and the playground resolve the workspace packages through
            # their exports, which point at dist/, so the solution builds first.
            - name: Build the packages
              run: pnpm build

            # Builds the playground into the site, generates the operation
            # pages and runs the checker over every craft the pages show.
            - name: Build the site
              run: pnpm -C site build

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
