name: Playground

# Builds the browser playground and publishes it to GitHub Pages on every
# push to main. Pages must be set to deploy from GitHub Actions in the
# repository settings once.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# A deployment in flight finishes; the next push queues behind it.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The playground resolves the workspace packages through their
            # exports, which point at dist/, so the solution builds first.
            - name: Build the packages
              run: pnpm build

            - name: Build the playground
              run: pnpm -C editors/playground build

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: editors/playground/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
