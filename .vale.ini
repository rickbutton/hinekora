StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = AiTells, write-good, Readability
Vocab = hinekora

[*.md]
BasedOnStyles = Vale, AiTells, write-good, Readability
# The game's names are not in a dictionary.
Vale.Spelling = NO
# Readability keeps one grade score; its per-word rules flag every long word.
Readability.Polysyllables = NO
Readability.ComplexWords = NO
Readability.MonoSyllabic = NO
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschReadingEase = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO
# E-Prime bans "is"; AiTells already reports passive voice.
write-good.E-Prime = NO
write-good.Passive = NO
